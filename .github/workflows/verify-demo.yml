name: Verify Fabrica Coffee demo (no deploy)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabrica-demo-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: HTML, JavaScript and menu data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without saved credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate demo without external services
        run: node scripts/verify-demo.mjs
